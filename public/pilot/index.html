<!doctype html><html lang="en-NZ"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Pilot | Shelf Audit</title><link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Lato,sans-serif;background:#f4f5f7;color:#1b1f24}
header{background:#111;color:#fff;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
header b{font-size:20px}.lock{background:#2a2a2a;padding:6px 10px;border-radius:6px;font-size:13px}
.wrap{display:flex;min-height:calc(100vh - 56px)}nav{width:220px;background:#fff;border-right:1px solid #ddd;padding:10px}
nav a{display:block;padding:8px 10px;color:#222;text-decoration:none;border-radius:6px;font-size:14px}nav a.on{background:#c62828;color:#fff}
nav .p{font-size:11px;background:#ffd54f;color:#000;padding:1px 5px;border-radius:4px;margin-left:4px}
main{flex:1;padding:24px}.card{background:#fff;border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;border-bottom:1px solid #eee;text-align:left}
.gate{background:linear-gradient(135deg,#7f0000,#c62828);color:#fff;text-align:center;padding:40px}.gate button,.btn{background:#ffd54f;border:0;padding:10px 18px;border-radius:6px;font-weight:700;cursor:pointer}
.bad{color:#c62828;font-weight:700}.good{color:#2e7d32;font-weight:700}select{padding:5px}
</style><style>@media (max-width:700px){.wrap{flex-direction:column}.wrap>*{min-width:0;max-width:100%}main{padding:14px}header{flex-wrap:wrap}table{display:block;overflow-x:auto;max-width:100%}img,canvas,svg{max-width:100%}}</style><link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&display=swap" rel="stylesheet"><style>
/* Brand panel: independent of nav flow */
header{position:sticky}
header>.brand{position:absolute;left:0;top:0;z-index:40;text-decoration:none}
header{padding-left:250px}
.brand .bw,.salock{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:#0b0b0c;padding:14px 22px 14px 20px;border-left:5px solid #3ddc84;border-bottom:1px solid rgba(61,220,132,.35);clip-path:polygon(0 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%);box-shadow:0 8px 24px rgba(0,0,0,.45)}
.brand .bw::after,.salock::after{content:"";position:absolute;right:0;bottom:0;width:16px;height:16px;background:linear-gradient(135deg,transparent 50%,#3ddc84 50%)}
.brand .bw>span:first-child,.salock>a{font-family:"Chakra Petch",sans-serif!important;font-weight:700!important;font-size:28px!important;letter-spacing:.05em!important;text-transform:uppercase!important;line-height:1!important;color:#f4efe6!important;text-decoration:none!important;margin:0!important}
.brand .tagline,.salock>small{display:block!important;font-family:"Chakra Petch",sans-serif!important;font-weight:700!important;font-size:12.5px!important;letter-spacing:.07em!important;line-height:1.3!important;text-transform:uppercase!important;color:#3ddc84!important;white-space:nowrap;margin:0!important}
@media (max-width:980px){header{padding-left:20px}.brand .bw,.salock{padding:10px 16px 10px 14px;gap:4px;border-left-width:4px}.brand .bw>span:first-child,.salock>a{font-size:22px!important}.brand .tagline,.salock>small{font-size:11px!important}}
header{position:relative}.salock{position:absolute!important;left:0;top:0;z-index:40}@media (max-width:980px){header{padding-left:205px!important}}</style></head><body>
<header><span class="salock"><a href="/">Shelf Audit</a><small>Daily oversight of the<br>largest market in NZ</small></span><b>Price Pilot</b><a href="/plans/" style="color:#fff;font-size:13px">Plans and pricing</a><a href="/ownership/" style="font-size:13px;color:#ffe14a">Ownership</a><a href="/blog/" style="font-size:13px;color:#ff4d4d">Blog</a><span class="lock" id="lock"></span><label style="margin-left:auto;font-size:13px">Demo seat: <select id="seat"><option value="50">Local 50 km</option><option value="100">Local 100 km</option></select></label></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script src="app.js"></script><script src="/cyr.js" defer></script>
</body></html>
